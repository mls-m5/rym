name: Emscripten build and GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:6.0.4

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build Emscripten application
        run: ./emscripten-build.sh

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp build/emscripten/index.html _site/
          cp build/emscripten/rym.html _site/
          cp build/emscripten/rym.js _site/
          cp build/emscripten/rym.wasm _site/
          cp build/emscripten/manifest.webmanifest _site/
          cp build/emscripten/service-worker.js _site/
          cp build/emscripten/rym-logo.png _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
